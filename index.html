<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CULBOT · Advanced Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Highlight.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/monokai-sublime.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<!-- and it's easy to individually load additional languages -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            color: #e8e8e8;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #0f0f0f;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            flex-shrink: 0;
            overflow-y: auto;
            transition: width 0.3s;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 10px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 8px 16px 8px;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 16px;
        }

        .sidebar .brand {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #6a8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-toggle {
            background: transparent;
            border: none;
            color: #6a6a6a;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .sidebar-toggle:hover {
            background: #2a2a2a;
            color: #e8e8e8;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #252525, #2a2a2a);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
            width: 100%;
        }

        .new-chat-btn:hover {
            background: linear-gradient(135deg, #303030, #353535);
            border-color: #4a6cf7;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.15);
        }

        .new-chat-btn i {
            font-size: 18px;
            color: #6a8cff;
        }

        .model-selector {
            margin-bottom: 20px;
            position: relative;
        }

        .model-selector label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6a6a6a;
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .custom-dropdown {
            position: relative;
            width: 100%;
            background: #252525;
            border: 1px solid #333;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
        }

        .custom-dropdown:hover {
            border-color: #4a6cf7;
        }

        .custom-dropdown .selected {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 400;
        }

        .custom-dropdown .selected i {
            color: #6a6a6a;
            transition: 0.3s;
            font-size: 13px;
        }

        .custom-dropdown.open .selected i {
            transform: rotate(180deg);
        }

        .custom-dropdown .options {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #222;
            border: 1px solid #333;
            border-radius: 10px;
            max-height: 180px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            padding: 4px 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .custom-dropdown.open .options {
            display: block;
        }

        .custom-dropdown .options::-webkit-scrollbar {
            width: 3px;
        }
        .custom-dropdown .options::-webkit-scrollbar-thumb {
            background: #4a6cf7;
            border-radius: 10px;
        }

        .custom-dropdown .option-item {
            padding: 10px 14px;
            color: #d0d0d0;
            font-size: 14px;
            transition: 0.15s;
            cursor: pointer;
        }

        .custom-dropdown .option-item:hover {
            background: #2f2f2f;
            color: white;
        }

        .custom-dropdown .option-item.selected-opt {
            background: #2a2a3a;
            color: #6a8cff;
        }

        .history-label {
            font-size: 11px;
            color: #5a5a5a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            padding: 8px 8px 4px 8px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-label .clear-history {
            background: transparent;
            border: none;
            color: #5a5a5a;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .history-label .clear-history:hover {
            color: #ff6b6b;
            background: #2a1a1a;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            color: #b0b0b0;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            margin: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item:hover {
            background: #252525;
            color: #e8e8e8;
        }

        .history-item.active {
            background: #252525;
            border-left: 3px solid #6a8cff;
        }

        .history-item i {
            color: #4a4a4a;
            font-size: 13px;
            flex-shrink: 0;
        }

        .history-item .delete-chat {
            margin-left: auto;
            background: transparent;
            border: none;
            color: #4a4a4a;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.2s;
            font-size: 12px;
        }

        .history-item .delete-chat:hover {
            color: #ff6b6b;
            background: #2a1a1a;
        }

        /* ===== MAIN CHAT ===== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #141414;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 28px;
            border-bottom: 1px solid #232323;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: #141414;
        }

        .chat-header .title {
            font-weight: 500;
            font-size: 16px;
            color: #d0d0d0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header .title i {
            color: #6a8cff;
        }

        .chat-header .title .chat-name {
            font-weight: 300;
            color: #6a6a6a;
            font-size: 14px;
        }

        .chat-header .status-dot {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #6a6a6a;
        }

        .chat-header .status-dot .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6a8cff;
            animation: pulse 1.8s infinite;
        }

        .chat-header .status-dot .dot.offline {
            background: #6a6a6a;
            animation: none;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.4; transform: scale(0.9); }
        }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 28px 8px 28px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 20px;
        }

        /* Chat bubbles */
        .bubble {
            max-width: 78%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
            margin-bottom: 4px;
            position: relative;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #6a8cff, #5a7cf7);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(74, 108, 247, 0.2);
        }

        .bubble.ai {
            align-self: flex-start;
            background: #252525;
            color: #e8e8e8;
            border-bottom-left-radius: 4px;
            border: 1px solid #2e2e2e;
        }
        .bubble.ai h1 {
            font-size: 2.5em;
        }
        .bubble.ai h2 {
            font-size: 2em;
        }
        .bubble.ai h3 {
            font-size: 1.75em;
        }
        .bubble.ai h4 {
            font-size: 1.5em;
        }
        .bubble.ai h5 {
            font-size: 1.25em;
        }
        .bubble.ai h6 {
            font-size: 1.1em;
        }
        .bubble.ai p {
            margin-bottom: 1em;
        }
        .bubble.ai ul {
            margin-bottom: 1em;
            padding-left: 1.5em;
        }
        .bubble.ai ol {
            margin-bottom: 1em;
            padding-left: 1.5em;
        }
        .bubble.ai li {
            margin-bottom: 0.5em;
        }
        .bubble.ai code {
            font-family: monospace;
            background-color: #141414;
            padding: 25px;
            border-radius: 25px;
        }

        .bubble .bubble-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 12px;
            opacity: 0.7;
            font-weight: 500;
        }

        .bubble.user .bubble-meta {
            justify-content: flex-end;
        }

        .bubble .bubble-meta .name {
            font-weight: 600;
        }

        .bubble .bubble-content {
            padding-left: 2px;
        }

        .bubble .bubble-content .timestamp {
            font-size: 11px;
            color: #6a6a6a;
            margin-top: 4px;
            opacity: 0.6;
        }

        .bubble.user .bubble-content .timestamp {
            color: rgba(255,255,255,0.6);
        }

        /* Streaming bubble */
        .bubble.streaming {
            background: #252525;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            padding: 12px 18px;
            border: 1px solid #2e2e2e;
        }

        .bubble.streaming .bubble-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bubble.streaming .stream-text {
            color: #e8e8e8;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* DOT that stays at the end of text, under username */
        .streaming-dot-wrapper {
            display: inline;
        }

        .streaming-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #6a8cff;
            border-radius: 50%;
            animation: blinkDot 0.9s infinite;
            margin-left: 4px;
            vertical-align: middle;
            flex-shrink: 0;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 0.2; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Suggestions */
        .suggestions {
            display: flex;
            gap: 8px;
            padding: 8px 28px 4px 28px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .suggestion-chip {
            background: #1f1f1f;
            border: 1px solid #2e2e2e;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .suggestion-chip:hover {
            background: #2a2a2a;
            border-color: #4a6cf7;
            color: #e8e8e8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.1);
        }

        .suggestion-chip i {
            font-size: 12px;
            color: #6a8cff;
        }

        /* Footer */
        .footer {
            padding: 10px 28px 20px 28px;
            background: #141414;
            border-top: 1px solid #232323;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1f1f1f;
            border-radius: 40px;
            padding: 4px 4px 4px 22px;
            border: 1px solid #2e2e2e;
            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f0f0;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            padding: 12px 0;
        }

        .input-wrapper input::placeholder {
            color: #4a4a4a;
            font-weight: 300;
            font-size: 14px;
        }

        .input-wrapper .send-icon {
            background: linear-gradient(135deg, #6a8cff, #5a7cf7);
            border: none;
            border-radius: 40px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            color: white;
            font-size: 18px;
        }

        .input-wrapper .send-icon:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(74, 108, 247, 0.3);
        }

        .input-wrapper .send-icon:active {
            transform: scale(0.94);
        }

        .input-wrapper .send-icon:disabled {
            opacity: 0.3;
            pointer-events: none;
            transform: none;
        }

        /* Scroll to bottom button */
        .scroll-btn {
            position: absolute;
            bottom: 90px;
            right: 30px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }

        .scroll-btn:hover {
            background: #333;
            color: white;
            border-color: #4a6cf7;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
                padding: 12px 8px;
            }
            .messages {
                padding: 12px 16px 4px 16px;
            }
            .footer {
                padding: 8px 16px 16px 16px;
            }
            .bubble {
                max-width: 88%;
                font-size: 14px;
            }
            .suggestions {
                padding: 4px 16px;
            }
            .chat-header {
                padding: 10px 16px;
            }
        }

        @media (max-width: 550px) {
            .sidebar {
                display: none;
            }
            .app {
                flex-direction: column;
            }
        }

        /* Scroll to bottom button */
        .messages-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
            align-self: flex-start;
            margin-left: 4px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #6a6a6a;
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* Temperature slider */
        .temp-control {
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .temp-control label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6a6a6a;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .temp-control input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #2a2a2a;
            border-radius: 2px;
            outline: none;
            margin-top: 4px;
        }

        .temp-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6a8cff;
            cursor: pointer;
            transition: 0.2s;
        }

        .temp-control input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">CULBOT</div>
            <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-chevron-left"></i></button>
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            <i class="fas fa-plus"></i> New Chat
        </button>

        <div class="model-selector">
            <label><i class="fas fa-brain"></i> Model</label>
            <div class="custom-dropdown" id="modelDropdown">
                <div class="selected" id="selectedModel">
                    <span>Loading...</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="options" id="modelOptions"></div>
            </div>
        </div>

        <div class="temp-control">
            <label>
                <span><i class="fas fa-thermometer-half"></i> Temperature</span>
                <span id="tempValue">0.7</span>
            </label>
            <input type="range" id="temperatureSlider" min="0" max="1.5" step="0.05" value="0.7">
        </div>

        <div class="history-label">
            <span><i class="far fa-clock"></i> Chat History</span>
            <button class="clear-history" id="clearHistoryBtn"><i class="fas fa-trash-alt"></i></button>
        </div>
        <div id="historyList"></div>
    </div>

    <!-- MAIN CHAT -->
    <div class="main-chat">
        <div class="chat-header">
            <div class="title">
                <i class="fas fa-comment-dots"></i>
                <span>CULBOT</span>
                <span class="chat-name" id="chatName">— New Chat</span>
            </div>
            <div class="status-dot">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">ready</span>
            </div>
        </div>

        <div class="messages-wrapper">
            <div class="messages" id="messages"></div>
            <button class="scroll-btn" id="scrollBtn" style="display:none;"><i class="fas fa-chevron-down"></i></button>
        </div>

        <div class="suggestions" id="suggestions">
            <button class="suggestion-chip"><i class="fas fa-lightbulb"></i> What's new in AI?</button>
            <button class="suggestion-chip"><i class="fas fa-code"></i> Write a Python function</button>
            <button class="suggestion-chip"><i class="fas fa-globe"></i> Explain climate change</button>
            <button class="suggestion-chip"><i class="fas fa-pencil-alt"></i> Write a haiku</button>
        </div>

        <div class="footer">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Send a message..." autofocus>
                <button class="send-icon" id="sendBtn"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    $(document).ready(function () {
        // ===== STATE =====
        const state = {
            currentChatId: null,
            chats: {},
            currentModel: 'llama3.2:3b',
            temperature: 0.7,
            isStreaming: false,
            streamingBubble: null,
            fullContent: '',
            messageHistory: [],
            chatNames: {}
        };

        // ===== DOM REFS =====
        const $messages = $('#messages');
        const $input = $('#userInput');
        const $sendBtn = $('#sendBtn');
        const $status = $('#statusText');
        const $statusDot = $('#statusDot');
        const $modelDropdown = $('#modelDropdown');
        const $selectedModel = $('#selectedModel span');
        const $modelOptions = $('#modelOptions');
        const $historyList = $('#historyList');
        const $chatName = $('#chatName');
        const $scrollBtn = $('#scrollBtn');
        const $tempSlider = $('#temperatureSlider');
        const $tempValue = $('#tempValue');

        // ===== INIT =====
        function init() {
            loadChatsFromStorage();
            fetchModels();
            if (Object.keys(state.chats).length === 0) {
                createNewChat();
            } else {
                const firstId = Object.keys(state.chats)[0];
                loadChat(firstId);
            }
            setupEventListeners();
            updateHistoryUI();
            console.log('✅ CULBOT Advanced UI loaded');
        }

        // ===== STORAGE =====
        function saveChatsToStorage() {
            try {
                const data = {
                    chats: state.chats,
                    chatNames: state.chatNames,
                    currentChatId: state.currentChatId
                };
                localStorage.setItem('culbot_chats', JSON.stringify(data));
            } catch (e) { console.warn('Save failed', e); }
        }

        function loadChatsFromStorage() {
            try {
                const raw = localStorage.getItem('culbot_chats');
                if (raw) {
                    const data = JSON.parse(raw);
                    state.chats = data.chats || {};
                    state.chatNames = data.chatNames || {};
                    state.currentChatId = data.currentChatId || null;
                }
            } catch (e) { console.warn('Load failed', e); }
        }

        // ===== CHAT MANAGEMENT =====
        function createNewChat() {
            const id = 'chat_' + Date.now();
            state.chats[id] = [];
            state.chatNames[id] = 'New Chat';
            state.currentChatId = id;
            state.messageHistory = [];
            $messages.empty();
            appendWelcomeMessage();
            updateChatName();
            updateHistoryUI();
            saveChatsToStorage();
            return id;
        }

        function loadChat(chatId) {
            if (!state.chats[chatId]) return;
            state.currentChatId = chatId;
            state.messageHistory = state.chats[chatId] || [];
            $messages.empty();
            if (state.messageHistory.length === 0) {
                appendWelcomeMessage();
            } else {
                state.messageHistory.forEach(msg => {
                    appendBubble(msg.role, msg.content, false);
                });
            }
            updateChatName();
            updateHistoryUI();
            scrollToBottom();
        }

        function deleteChat(chatId) {
            if (Object.keys(state.chats).length <= 1) {
                delete state.chats[chatId];
                delete state.chatNames[chatId];
                createNewChat();
            } else {
                delete state.chats[chatId];
                delete state.chatNames[chatId];
                const remaining = Object.keys(state.chats);
                if (state.currentChatId === chatId) {
                    loadChat(remaining[0]);
                }
                updateHistoryUI();
            }
            saveChatsToStorage();
        }

        function updateChatName() {
            const name = state.chatNames[state.currentChatId] || 'New Chat';
            $chatName.text('— ' + name);
        }

        function updateHistoryUI() {
            $historyList.empty();
            const ids = Object.keys(state.chats);
            if (ids.length === 0) {
                $historyList.html('<div class="history-item" style="color:#5a5a5a;font-style:italic;padding:12px;">No chats yet</div>');
                return;
            }
            ids.forEach(id => {
                const name = state.chatNames[id] || 'Untitled';
                const preview = state.chats[id] && state.chats[id].length > 0 ? 
                    state.chats[id].filter(m => m.role === 'user').pop()?.content?.substring(0, 30) || name : name;
                const isActive = id === state.currentChatId;
                const item = $(`
                    <div class="history-item ${isActive ? 'active' : ''}">
                        <i class="fas fa-comment"></i>
                        <span>${preview}${preview.length > 25 ? '...' : ''}</span>
                        <button class="delete-chat" data-id="${id}"><i class="fas fa-times"></i></button>
                    </div>
                `);
                item.on('click', function(e) {
                    if (!$(e.target).closest('.delete-chat').length) {
                        loadChat(id);
                    }
                });
                item.find('.delete-chat').on('click', function(e) {
                    e.stopPropagation();
                    if (confirm('Delete this chat?')) {
                        deleteChat(id);
                    }
                });
                $historyList.append(item);
            });

        }

        // ===== MESSAGE RENDERING =====
        function appendBubble(role, content, save = true) {
            const bubble = $('<div class="bubble"></div>');
            const time = new Date().toLocaleTimeString();
            if (role === 'user') {
                bubble.addClass('user');
                bubble.html(`
                    <div class="bubble-meta"><span class="name">You</span></div>
                    <div class="bubble-content">${content}<div class="timestamp">${time}</div></div>
                `);
            } else {
                bubble.addClass('ai');
                bubble.html(`
                    <div class="bubble-meta"><span class="name">CULBOT</span></div>
                    <div class="bubble-content" style="padding: 4px 5px;">${content}<div class="timestamp">${time}</div></div> 
                `);
                // parse markdown bubble content NOT JUST CONTENT the bubble content, so we can have markdown in the bubble
                // CLEAN THE MARKDOWN to not make it look bad 
                const cleanContent = marked.parse(content);
                bubble.find('.bubble-content').html(cleanContent);
                // highlight code
                hljs.highlightAll();
            }
            $messages.append(bubble);
            if (save && state.currentChatId) {
                state.messageHistory.push({ role, content, timestamp: time });
                state.chats[state.currentChatId] = state.messageHistory;
                saveChatsToStorage();
                // Update chat name from first user message
                if (role === 'user' && state.chatNames[state.currentChatId] === 'New Chat') {
                    const preview = content.substring(0, 30);
                    state.chatNames[state.currentChatId] = preview + (content.length > 30 ? '...' : '');
                    updateChatName();
                    updateHistoryUI();
                    saveChatsToStorage();
                }
            }
            scrollToBottom();
            return bubble;
        }

        function appendWelcomeMessage() {
            appendBubble('ai', '👋 Hello! I\'m CULBOT. I have memory of our conversation and can help with anything. What would you like to know?', true);
        }

        // ===== STREAMING =====
        function createStreamingBubble() {
            $('.bubble.streaming').remove();
            const bubble = $('<div class="bubble streaming ai"></div>');
            bubble.html(`
                <div class="bubble-meta"><span class="name">CULBOT</span></div>
                <div class="bubble-content">
                    <span class="stream-text"></span>
                    <span class="streaming-dot"></span>
                </div>
            `);
            $messages.append(bubble);
            scrollToBottom();
            return bubble;
        }

        function updateStreamingText(text) {
            if (!state.streamingBubble) return;
            state.streamingBubble.find('.stream-text').text(text);
            scrollToBottom();
        }


        function finishStreaming(finalText) {
            if (state.streamingBubble) {
                state.streamingBubble.remove();
                state.streamingBubble = null;
                if (finalText && finalText.trim() !== '') {
                    appendBubble('ai', finalText, true);
                } else {
                    appendBubble('ai', '*(empty response)*', true);
                }
            }
            state.isStreaming = false;
            $sendBtn.prop('disabled', false);
            $input.prop('disabled', false);
            $input.focus();
            $status.text('ready');
            $statusDot.removeClass('offline');
        }


        // ===== SEND MESSAGE =====
        function sendMessage() {
            const raw = $input.val().trim();
            if (!raw || state.isStreaming) return;

            $input.val('');
            $sendBtn.prop('disabled', true);
            $input.prop('disabled', true);
            $status.text('thinking...');
            $statusDot.removeClass('offline');

            appendBubble('user', raw, true);

            state.streamingBubble = createStreamingBubble();
            state.isStreaming = true;
            state.fullContent = '';

            const history = state.messageHistory.slice(-10).map(m => ({
                role: m.role === 'user' ? 'user' : 'assistant',
                content: m.content
            }));

            const payload = {
                model: state.currentModel,
                messages: [
                    { role: 'system', content: 'You are CulBot, a helpful AI assistant.You also use MARKDOWN! You have memory of the conversation. Be concise, accurate, and helpful. Your display name is CULBOT. Youre ai model is "Flamingo-MAX" You were developed by MosaicX. You use Emojis so you can express yourself. For code dont use ``` use for example <pre><code class="language-LANGUAGEHERE">...</code></pre>' },
                    ...history,
                    { role: 'user', content: raw }
                ],
                stream: true,
                options: {
                    temperature: state.temperature
                }
            };

            fetch('https://anthem-irritate-precise.ngrok-free.dev/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');

                function readStream() {
                    reader.read().then(({ done, value}) => {
                        if (done) {
                            finishStreaming(state.fullContent);
                            return;
                        }
                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n').filter(l => l.trim() !== '');
                        for (const line of lines) {
                            try {
                                const parsed = JSON.parse(line);
                                if (parsed.message && parsed.message.content) {
                                    state.fullContent += parsed.message.content;
                                    updateStreamingText(state.fullContent);
                                }
                            } catch (_) {}
                        }
                        readStream();
                    });
                }
                readStream();
            })
            .catch(err => {
                console.error('Stream error:', err);
                if (state.streamingBubble) {
                    state.streamingBubble.find('.stream-text').text('⚠️ ' + err.message);
                    state.streamingBubble.find('.streaming-dot').remove();
                }
                state.isStreaming = false;
                $sendBtn.prop('disabled', false);
                $input.prop('disabled', false);
                $input.focus();
                $status.text('error');
                $statusDot.addClass('offline');
            });
        }

        // ===== FETCH MODELS =====
        function fetchModels() {
            $.ajax({
                url: 'http://localhost:11434/api/tags',
                method: 'GET',
                dataType: 'json',
                timeout: 3000,
                success: function(data) {
                    const models = data.models || [];
                    if (models.length === 0) {
                        $selectedModel.text('No models');
                        return;
                    }
                    $modelOptions.empty();
                    models.forEach((m) => {
                        const name = m.name;
                        const opt = $('<div class="option-item"></div>').text(name);
                        if (name === state.currentModel) opt.addClass('selected-opt');
                        opt.on('click', function() {
                            state.currentModel = name;
                            $selectedModel.text(name);
                            $modelOptions.find('.option-item').removeClass('selected-opt');
                            $(this).addClass('selected-opt');
                            $modelDropdown.removeClass('open');
                        });
                        $modelOptions.append(opt);
                    });
                    if (!models.some(m => m.name === state.currentModel)) {
                        state.currentModel = models[0].name;
                        $selectedModel.text(state.currentModel);
                        $modelOptions.find('.option-item').first().addClass('selected-opt');
                    }
                },
                error: function() {
                    $selectedModel.text('Ollama offline');
                    $modelOptions.html('<div class="option-item" style="color:#6a6a6a;">⚠️ Cannot connect</div>');
                }
            });
        }

        // ===== SCROLL =====
        function scrollToBottom() {
            const msgs = document.getElementById('messages');
            if (msgs) {
                msgs.scrollTop = msgs.scrollHeight;
                $scrollBtn.hide();
            }
        }

        // ===== EVENTS =====
        function setupEventListeners() {
            // Send
            $sendBtn.on('click', sendMessage);
            $input.on('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // New chat
            $('#newChatBtn').on('click', function() {
                createNewChat();
                updateHistoryUI();
                saveChatsToStorage();
            });

            // Clear history
            $('#clearHistoryBtn').on('click', function() {
                if (confirm('Delete all chats?')) {
                    const currentId = state.currentChatId;
                    state.chats = {};
                    state.chatNames = {};
                    createNewChat();
                    updateHistoryUI();
                    saveChatsToStorage();
                }
            });

            // Model dropdown
            $modelDropdown.on('click', function(e) {
                e.stopPropagation();
                $(this).toggleClass('open');
            });
            $(document).on('click', function() {
                $modelDropdown.removeClass('open');
            });

            // Temperature
            $tempSlider.on('input', function() {
                state.temperature = parseFloat($(this).val());
                $tempValue.text(state.temperature.toFixed(2));
            });

            // Scroll button
            $(document).on('scroll', '#messages', function() {
                const el = this;
                const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 20;
                $scrollBtn.toggle(!atBottom);
            });

            $scrollBtn.on('click', scrollToBottom);

            // Sidebar toggle
            let sidebarOpen = true;
            $('#sidebarToggle').on('click', function() {
                sidebarOpen = !sidebarOpen;
                $('#sidebar').css('width', sidebarOpen ? '280px' : '60px');
                $(this).find('i').toggleClass('fa-chevron-left fa-chevron-right');
                if (!sidebarOpen) {
                    $('#sidebar .brand, #sidebar .new-chat-btn span, #sidebar .model-selector label, #sidebar .temp-control, #sidebar .history-label span, #sidebar .history-item span, #sidebar .delete-chat, #sidebar .sidebar-header .brand').hide();
                    $('#sidebar .new-chat-btn i, #sidebar .history-item i').show();
                } else {
                    $('#sidebar .brand, #sidebar .new-chat-btn span, #sidebar .model-selector label, #sidebar .temp-control, #sidebar .history-label span, #sidebar .history-item span, #sidebar .delete-chat, #sidebar .sidebar-header .brand').show();
                }
            });
        }

        // ===== START =====
        init();
    });
</script>
</body>
</html>
